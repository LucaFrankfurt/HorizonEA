# HorizonEA – application + PostgreSQL with a persistent volume.
#
# This file is ready for Coolify (Docker Compose build pack):
#   - no host ports are published; Coolify's proxy routes the domain to the
#     app container on port 3000 (SERVICE_URL_APP_3000)
#   - the database password and the login password are generated by Coolify
#     (SERVICE_PASSWORD_POSTGRES / SERVICE_PASSWORD_LOGIN) and stored under
#     Environment Variables
#   - the database is only reachable from the app container
#
# Running on a plain Docker host instead? Add the local override, which
# publishes the port and supplies local defaults:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
name: horizon-ea

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=horizon
      - POSTGRES_DB=horizon
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-EUR}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify: route the resource's domain to this container's port 3000
      - SERVICE_URL_APP_3000
      - DATABASE_URL=postgres://horizon:${SERVICE_PASSWORD_POSTGRES}@db:5432/horizon
      # HTTP Basic Auth for UI and API – user below, password generated by Coolify.
      # An empty password disables the login.
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASSWORD=${SERVICE_PASSWORD_LOGIN}
      # Load the demo landscape into a brand-new database (false = start empty)
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # Allow "Reset demo data" / "Clear all data" on the Import / Export page
      - ALLOW_DEMO_RESET=${ALLOW_DEMO_RESET:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
